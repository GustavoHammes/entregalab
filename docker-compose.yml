name: entregalab

services:
  postgres:
    image: postgres:16-alpine
    container_name: entregalab-postgres
    environment:
      POSTGRES_USER: entregalab
      POSTGRES_PASSWORD: entregalab
      POSTGRES_DB: entregalab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entregalab -d entregalab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: entregalab-api
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://entregalab:entregalab@postgres:5432/entregalab
      JWT_SECRET: local-development-secret-change-before-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/repo/apps/api/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: entregalab-web
    environment:
      API_PROXY_TARGET: http://api:3333
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web/index.html:/repo/apps/web/index.html
      - ./apps/web/src:/repo/apps/web/src

volumes:
  postgres_data:
