name: entregalab-tests
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: entregalab_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d entregalab_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: build
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@database:5432/entregalab_test
      JWT_SECRET: isolated-test-secret-at-least-32-characters
    depends_on:
      database:
        condition: service_healthy
    command: ["npm", "test"]
